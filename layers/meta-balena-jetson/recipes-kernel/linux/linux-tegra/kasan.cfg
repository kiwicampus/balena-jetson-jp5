# JP5 bring-up: find the heap corruption seen on the Kiwi Xavier (random panics ~80-100 s after boot)
CONFIG_KASAN=y
CONFIG_KASAN_GENERIC=y
CONFIG_KASAN_OUTLINE=y
# CONFIG_KASAN_INLINE is not set
# nvethernet builds with -Werror and KASAN inflates stack frames
CONFIG_FRAME_WARN=8192
CONFIG_KASAN_VMALLOC=y
CONFIG_STACKTRACE=y
CONFIG_DEBUG_INFO=y
CONFIG_SLUB_DEBUG=y
CONFIG_SLUB_DEBUG_ON=y
CONFIG_DEBUG_LIST=y
CONFIG_PANIC_ON_OOPS=y
CONFIG_PANIC_TIMEOUT=5
